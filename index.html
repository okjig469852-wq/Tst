<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>موقعنا ستور - تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .card {
      width: min(92%, 420px);
      padding: 30px;
      border-radius: 22px;
      background: #1e293b;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #googleLogin {
      background: white;
      color: #111827;
    }

    #logout {
      display: none;
      margin-top: 12px;
      background: #ef4444;
      color: white;
    }

    #userBox {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #0f172a;
      border-radius: 14px;
    }

    #userPhoto {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: none;
      margin: 0 auto 12px;
    }

    #status {
      margin-top: 15px;
      color: #93c5fd;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>موقعنا ستور</h1>
    <p>سجل الدخول بحساب Google</p>

    <button id="googleLogin">
      🔐 تسجيل الدخول باستخدام Google
    </button>

    <div id="userBox">
      <img id="userPhoto">

      <h3 id="userName"></h3>
      <p id="userEmail"></p>
    </div>

    <button id="logout">
      تسجيل الخ
