<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>موقعنا ستور | تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top, #1e3a8a, transparent 40%),
        #07111f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: rgba(15,23,42,.92);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 12px 30px rgba(37,99,235,.35);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin: 10px 0 28px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    #loginBtn {
      background: white;
      color: #111827;
    }

    #loginBtn:hover {
      background: #e5e7eb;
    }

    #logoutBtn {
      display: none;
      margin-top: 12px;
      background: #dc2626;
      color: white;
    }

    #userBox {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(2,6,23,.7);
      border: 1px solid rgba(255,255,255,.08);
    }

    #photo {
      display: none;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 12px;
      border: 3px solid #3b82f6;
    }

    #name {
      margin: 8px 0;
    }

    #email {
      margin: 0;
      color: #94a3b8;
      word-break: break-word;
      font-size: 14px;
    }

    #status {
      min-height: 22px;
      margin-top: 18px;
      color: #93c5fd;
      font-size: 14px;
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }

    .success {
      color: #4ade80 !important;
    }

    .error {
      color: #f87171 !important;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">🛍️</div>

    <h1>موقعنا ستور</h1>

    <p class="subtitle">
      سجّل دخولك للوصول إلى حسابك
    </p>

    <button id="loginBtn">
      🔐 تسجيل الدخول باستخدام Google
    </button>

    <section id="userBox">

      <img id="photo" alt="صورة المستخدم">

      <h3 id="name"></h3>

      <p id="email"></p>

    </section>

    <button id="logoutBtn">
      🚪 تسجيل الخروج
    </button>

    <div id="status"></div>

  </main>
